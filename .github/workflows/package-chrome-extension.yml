name: Package Chrome extension

on:
  push:
    branches:
      - main
      - develop
      - codex/chrome-extension
    paths:
      - 'extension/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'jest.config.*'
      - '.nvmrc'
      - '.github/workflows/package-chrome-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Chrome extension
        run: npm test -- --runInBand extension/

      - name: Build Chrome extension
        run: npm run build:extension

      - name: Create Chrome Web Store ZIP
        working-directory: out/chrome-extension
        run: zip -qr ../cozy-watch-chrome.zip .

      - name: Upload Chrome Web Store ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: out/cozy-watch-chrome.zip
          if-no-files-found: error
          retention-days: 14
          archive: false
