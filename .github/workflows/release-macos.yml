name: Release macOS

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      retention_days:
        description: Days to retain the downloadable development build
        required: true
        default: "14"
        type: choice
        options:
          - "7"
          - "14"
          - "30"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package version $package_version."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm run lint
          npm run types
          npm test -- --runInBand

      - name: Prepare versioned release branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: prepare-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          latest_release_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          package_version="$(node -p "require('./package.json').version")"
          latest_release_version="${latest_release_tag#v}"
          changed_paths="$(git diff --name-only HEAD^ HEAD)"

          if [[ "$package_version" == "$latest_release_version" && -n "$latest_release_version" ]] && \
            [[ -n "$changed_paths" ]] && \
            ! grep -Ev '^(package\.json|package-lock\.json)$' <<< "$changed_paths"; then
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            echo "Version sync for $package_version is already released."
            exit 0
          fi

          release_version="$(node -e 'const semver = require("semver"); const current = require("./package.json").version; const latest = (process.argv[1] || "").replace(/^v/, ""); process.stdout.write(latest && semver.gt(current, latest) ? current : semver.inc(latest || current, "patch"));' "$latest_release_tag")"
          release_branch="release/version-v${release_version}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$release_version" --no-git-tag-version
          git switch --create "$release_branch"
          git add package.json package-lock.json
          git commit -m "chore: release v${release_version}"
          git tag --force "v${release_version}"
          git push --force origin "HEAD:refs/heads/${release_branch}" "refs/tags/v${release_version}"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_branch=$release_branch" >> "$GITHUB_OUTPUT"
          echo "skip_release=false" >> "$GITHUB_OUTPUT"

      - name: Import Apple signing certificate
        if: steps.prepare-release.outputs.skip_release != 'true'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/cozywatch-certificate.p12"
          keychain_path="$RUNNER_TEMP/cozywatch-signing.keychain-db"

          echo -n "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Build, verify, notarize, and publish or rehearse
        if: steps.prepare-release.outputs.skip_release != 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          COZYWATCH_DIAGNOSTICS_BUILD: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            npm run publish:mac
          else
            npm run make:mac:official
          fi

      - name: Upload signed release-candidate build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cozy-watch-rc-diagnostics-${{ github.run_number }}-${{ github.sha }}
          path: |
            out/make/*.dmg
            out/make/zip/**/*.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Open version sync pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.prepare-release.outputs.skip_release == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.prepare-release.outputs.release_branch }}
          RELEASE_VERSION: ${{ steps.prepare-release.outputs.release_version }}
        shell: bash
        run: |
          existing_pr="$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json url --jq '.[0].url // ""')"
          if [[ -z "$existing_pr" ]]; then
            gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "chore: sync release v${RELEASE_VERSION}" \
              --body "Sync package.json and package-lock.json to the version published in release v${RELEASE_VERSION}."
          fi

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/cozywatch-signing.keychain-db" || true
